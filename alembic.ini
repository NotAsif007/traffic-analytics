# =============================================================================
# Alembic configuration
# =============================================================================
# This file is used by the alembic CLI.
# The DATABASE_URL used here is the SYNC psycopg2 DSN from the environment,
# NOT the async asyncpg DSN used by the application.
# =============================================================================

[alembic]
# Path to migration scripts directory
script_location = alembic

# Template for migration file names
file_template = %%(year)d%%(month)02d%%(day)02d_%%(hour)02d%%(minute)02d_%%(rev)s_%%(slug)s

# Timezone for file timestamps
timezone = UTC

# Maximum length of the slug (derived from the message)
truncate_slug_length = 40

# Output encoding
output_encoding = utf-8

# ---------------------------------------------------------------------------
# The DSN is read from the environment in alembic/env.py.
# Do NOT put credentials here.
# ---------------------------------------------------------------------------
sqlalchemy.url = driver://not-used-directly

# ---------------------------------------------------------------------------
# Logging configuration for alembic CLI output
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
