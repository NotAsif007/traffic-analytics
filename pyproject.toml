[project]
name = "traffic-analytics"
version = "0.1.0"
description = "City-Wide AI Engine for Multi-Camera ANPR Trajectory Tracking and Urban Traffic Analytics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",

    # Database — async
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "geoalchemy2==0.15.2",

    # Migrations
    "alembic==1.14.0",

    # Validation / serialisation
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",

    # Redis (infrastructure ready; not yet used in business logic)
    "redis==5.2.1",

    # HTTP client (for healthcheck, future AI integrations)
    "httpx==0.28.1",

    # Utilities
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "orjson==3.10.12",
    "shapely==2.0.6",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "anyio==4.7.0",

    # Database for tests
    "psycopg2-binary==2.9.10",

    # Code quality
    "ruff==0.8.6",
    "mypy==1.13.0",

    # Type stubs
    "types-redis==4.6.0.20241004",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length — ruff format handles this
    "B008",  # do not perform function calls in default arguments (FastAPI Depends)
    "SIM117",  # multiple with statements
    "B017",  # pytest.raises(Exception) in tests
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "-v",
    "--tb=short",
]
markers = [
    "unit: pure unit tests (no DB, no network)",
    "integration: tests that require a running database",
    "e2e: full end-to-end tests",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
