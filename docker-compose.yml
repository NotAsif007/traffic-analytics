# =============================================================================
# docker-compose.yml — Traffic Analytics (Development)
# =============================================================================
# Services:
#   db      — PostgreSQL 16 with PostGIS 3.4 extension
#   redis   — Redis 7 (infrastructure ready; not yet used in business logic)
#   api     — FastAPI application
#   migrate — One-shot Alembic migration runner (runs before api starts)
# =============================================================================

name: traffic-analytics

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL + PostGIS
  # ---------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traffic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traffic_pass}
      POSTGRES_DB: ${POSTGRES_DB:-traffic_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traffic_user} -d ${POSTGRES_DB:-traffic_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Database migrations (one-shot)
  # Runs alembic upgrade head, then exits.
  # api depends on this completing successfully.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      target: runtime
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        python -c \"
import asyncio, sys
import asyncpg
async def wait():
    for i in range(30):
        try:
            conn = await asyncpg.connect('${ALEMBIC_DATABASE_URL:-postgresql://traffic_user:traffic_pass@db:5432/traffic_db}'.replace('postgresql+psycopg2://', 'postgresql://').replace('postgresql+asyncpg://', 'postgresql://'))
            await conn.close()
            print('Database ready.')
            return
        except Exception as e:
            print(f'Attempt {i+1}/30: {e}')
            await asyncio.sleep(2)
    sys.exit(1)
asyncio.run(wait())
        \" &&
        alembic upgrade head
      "
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://traffic_user:traffic_pass@db:5432/traffic_db}
      ALEMBIC_DATABASE_URL: ${ALEMBIC_DATABASE_URL:-postgresql+psycopg2://traffic_user:traffic_pass@db:5432/traffic_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: on-failure

  # ---------------------------------------------------------------------------
  # FastAPI Application
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: traffic-analytics
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://traffic_user:traffic_pass@db:5432/traffic_db}
      ALEMBIC_DATABASE_URL: ${ALEMBIC_DATABASE_URL:-postgresql+psycopg2://traffic_user:traffic_pass@db:5432/traffic_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --workers 1
        --log-level info
    networks:
      - backend

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  backend:
    driver: bridge
